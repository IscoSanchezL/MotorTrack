<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iskonex MotorTrack</title>
<link rel="icon" href="logo.jpg">
<style>
:root{
  --bg:#060b1a;--card:#0e1730;--text:#e8edf8;--muted:#8fa0c4;--line:#1f2d52;
  --primary:#22b8ff;--primary-text:#04101f;--violet:#8b5cf6;
  --ok:#5eead4;--ok-bg:#0f3a38;--warn:#fcd34d;--warn-bg:#41330a;--bad:#fda4af;--bad-bg:#4a1626;--none:#cbd5e1;--none-bg:#222c47;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header.top .in{max-width:980px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
header.top h1{margin:0;flex:1;cursor:pointer;line-height:0}
header.top h1 img{height:44px;width:auto}
.hero{max-width:640px;margin:0 auto;padding:6vh 16px;text-align:center}
.hero img{width:100%;height:auto;display:block;margin-bottom:18px}
main{max-width:980px;margin:auto;padding:16px}
h2{margin:.2rem 0 1rem;font-size:1.3rem}
h3{margin:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:linear-gradient(90deg,var(--primary),var(--violet));color:var(--primary-text);border-color:var(--primary);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.6;cursor:wait}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.veh{cursor:pointer;transition:border-color .15s}
.veh:hover{border-color:var(--primary)}
.vh{display:flex;gap:12px;align-items:center}
.ico{font-size:1.8rem}
.muted{color:var(--muted);font-size:.9rem}
.km{font-size:1.4rem;font-weight:700;margin:10px 0 8px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.none{background:var(--none-bg);color:var(--none)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.banner{padding:12px 16px;border-radius:12px;margin-bottom:14px;font-weight:600}
.banner.bad{background:var(--bad-bg);color:var(--bad)}.banner.ok{background:var(--ok-bg);color:var(--ok)}
.center{max-width:460px;margin:6vh auto;padding:0 16px;text-align:center}
.center .card{padding:28px}
.items{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin:14px 0 22px}
.item .lbl{font-weight:600}.item .big{font-size:1.05rem;margin:4px 0 10px}
.tabs{display:flex;gap:6px;margin:6px 0 12px;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;color:var(--muted);padding:8px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--text);border-color:var(--primary);font-weight:600}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600}
td.wrap{white-space:normal;min-width:140px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:20px;width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:#0008}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.form input,.form select,.form textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.form label.chk{display:flex;gap:8px;align-items:center;color:var(--text)}
.form label.chk input{width:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
.avatar{width:30px;height:30px;border-radius:50%}
.badge{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem;margin-left:4px}
@media(max-width:560px){header.top .hide-sm{display:none}header.top h1 img{height:34px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,setDoc,getDocs,addDoc,updateDoc,deleteDoc,query,where,writeBatch} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const DOC_KINDS = {soat:'SOAT', impuesto:'Impuesto vehicular', tecno:'Revisión técnico-mecánica', seguro:'Seguro todo riesgo', otro:'Otro documento'};
const TRACKED = ['soat','impuesto','tecno'];          // siempre se muestran
const MAINT_KINDS = {aceite:'Cambio de aceite', filtro:'Filtros', llantas:'Llantas', frenos:'Frenos', arrastre:'Kit de arrastre / cadena', bateria:'Batería', otro:'Otro'};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fmtDate = d => d ? new Date(d+'T00:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const fmtKm = n => n == null ? '—' : Number(n).toLocaleString('es-CO') + ' km';
const fmtMoney = n => n == null ? '—' : Number(n).toLocaleString('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const daysUntil = d => Math.round((Date.parse(d) - Date.parse(todayStr())) / 864e5);
const addYear = d => { const x = new Date(d+'T00:00:00Z'); x.setUTCFullYear(x.getUTCFullYear()+1); x.setUTCDate(x.getUTCDate()-1); return x.toISOString().slice(0,10); };

const cfg = window.APP_CONFIG || {};
const configured = !!cfg.apiKey && !String(cfg.apiKey).startsWith('TU_');
let auth, db;
if(configured){ const app = initializeApp(cfg); auth = getAuth(app); db = getFirestore(app); }

const uid = () => auth.currentUser.uid;
const sortBy = (arr, ...keys) => arr.sort((a,b) => { for(const [k,dir] of keys){ const x=a[k]??'', y=b[k]??''; if(x!==y) return (x<y?-1:1)*dir; } return 0; });
const list = async col => (await getDocs(query(collection(db,col), where('user_id','==',uid())))).docs.map(d => ({id:d.id, ...d.data()}));
const add = (col, data) => addDoc(collection(db,col), {...data, user_id:uid(), created_at:new Date().toISOString()});
const upd = (col, id, data) => updateDoc(doc(db,col,id), data);
const del = (col, id) => deleteDoc(doc(db,col,id));

const state = {session:null, profile:null, vehicles:[], docs:[], maint:[], kmlog:[], users:[], tab:'docs'};

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),3500); }

/* ---------- carga de datos ---------- */
const OWNER = 'franksanlo@gmail.com';
async function load(){
  if(!configured) return render();
  const user = auth.currentUser;
  state.session = user;
  if(!user){ state.profile = null; return render(); }
  try{
    const ref = doc(db,'mt_users',user.uid);
    let snap = await getDoc(ref);
    if(!snap.exists()){
      const owner = user.email?.toLowerCase() === OWNER;
      await setDoc(ref, {email:user.email, full_name:user.displayName||null, avatar_url:user.photoURL||null,
        approved:owner, is_admin:owner, notify_email:true, telegram_chat_id:null, created_at:new Date().toISOString()});
      snap = await getDoc(ref);
    }
    state.profile = {id:user.uid, ...snap.data()};
    if(state.profile.approved) await loadAll();
  }catch(e){ toast(e.message); }
  render();
}
async function loadAll(){
  const [v,d,m,k] = await Promise.all([list('mt_vehicles'), list('mt_documents'), list('mt_maintenance'), list('mt_kmlog')]);
  Object.assign(state,{
    vehicles: sortBy(v,['created_at',1]),
    docs: sortBy(d,['expiry_date',-1]),
    maint: sortBy(m,['done_at',-1],['created_at',-1]),
    kmlog: sortBy(k,['logged_at',-1],['created_at',-1]),
  });
}
async function loadUsers(){
  const snap = await getDocs(collection(db,'mt_users'));
  state.users = sortBy(snap.docs.map(d=>({id:d.id,...d.data()})), ['created_at',-1]);
}

/* ---------- estado / alertas ---------- */
function level(days){ return days < 0 ? 'bad' : days <= 15 ? 'bad' : days <= 30 ? 'warn' : 'ok'; }
function kmPerDay(v){
  const k = state.kmlog.filter(x=>x.vehicle_id===v.id);
  if(k.length < 2) return null;
  const a = k[k.length-1], b = k[0], days = (Date.parse(b.logged_at)-Date.parse(a.logged_at))/864e5;
  return days >= 7 && b.km > a.km ? (b.km-a.km)/days : null;
}
function vehicleItems(v){
  const items = [];
  const kinds = [...TRACKED]; if(state.docs.some(d=>d.vehicle_id===v.id && d.kind==='seguro')) kinds.push('seguro');
  for(const kind of kinds){
    const last = state.docs.find(d => d.vehicle_id===v.id && d.kind===kind);
    if(!last){ items.push({type:'doc',kind,label:DOC_KINDS[kind],level:'none',text:'Sin registrar'}); continue; }
    const days = daysUntil(last.expiry_date);
    items.push({type:'doc',kind,label:DOC_KINDS[kind],level:level(days),last,
      text: days<0 ? `Vencido hace ${-days} d` : days===0 ? 'Vence hoy' : `Vence en ${days} d`,
      detail:`Vence ${fmtDate(last.expiry_date)}`});
  }
  const oil = state.maint.find(m => m.vehicle_id===v.id && m.kind==='aceite');
  if(!oil || oil.next_km == null) items.push({type:'oil',label:'Cambio de aceite',level:'none',text:'Sin registrar'});
  else{
    const left = oil.next_km - v.current_km, rate = kmPerDay(v);
    items.push({type:'oil',label:'Cambio de aceite',last:oil,
      level: left<=0 ? 'bad' : left<=v.alert_km_before ? 'warn' : 'ok',
      text: left<=0 ? `Pasado ${fmtKm(-left)}` : `Faltan ${fmtKm(left)}`,
      detail:`Próximo a ${fmtKm(oil.next_km)}` + (rate && left>0 ? ` · ≈ ${Math.round(left/rate)} días (${Math.round(rate)} km/día)` : '')});
  }
  return items;
}

/* ---------- formularios ---------- */
function fieldHtml(f, vals){
  const v = vals[f.name] ?? f.value ?? '';
  const req = f.required ? 'required' : '';
  if(f.type==='select') return `<label>${f.label}<select name="${f.name}" ${req}>${Object.entries(f.options).map(([k,t])=>`<option value="${k}" ${k===v?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
  if(f.type==='textarea') return `<label>${f.label}<textarea name="${f.name}" rows="2">${esc(v)}</textarea></label>`;
  if(f.type==='checkbox') return `<label class="chk"><input type="checkbox" name="${f.name}" ${v?'checked':''}>${f.label}</label>`;
  return `<label>${f.label}<input name="${f.name}" type="${f.type||'text'}" value="${esc(v)}" ${req} ${f.type==='number'?'inputmode="numeric" step="any" min="0"':''} placeholder="${esc(f.placeholder||'')}"></label>`;
}
function openForm({title, fields, values={}, submit='Guardar', onSubmit, setup}){
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<form class="form"><h3>${esc(title)}</h3>${fields.map(f=>fieldHtml(f,values)).join('')}<div class="row end"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">${submit}</button></div></form>`;
  document.body.append(dlg); dlg.showModal();
  dlg.addEventListener('close', () => dlg.remove());
  dlg.querySelector('[data-close]').onclick = () => dlg.close();
  const form = dlg.querySelector('form');
  setup?.(form);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const out = {};
    for(const f of fields){
      const el = form.elements[f.name];
      if(f.type==='checkbox') out[f.name] = el.checked;
      else{ let x = el.value.trim(); out[f.name] = x==='' ? null : f.type==='number' ? Number(x) : x; }
    }
    const btn = form.querySelector('.primary'); btn.disabled = true;
    try{ await onSubmit(out); dlg.close(); }
    catch(err){ toast(err.message || String(err)); btn.disabled = false; }
  });
}
// al cambiar un campo "fuente", completa el campo "destino" mientras el usuario no lo haya tocado
function autofill(form, src, dst, fn){
  const s = form.elements[src], d = form.elements[dst]; let touched = !!d.value;
  d.addEventListener('input', () => touched = true);
  s.addEventListener('input', () => { if(!touched){ const r = fn(s.value); if(r != null) d.value = r; } });
}

function vehicleForm(v){
  const isNew = !v;
  openForm({
    title: isNew ? 'Nuevo vehículo' : 'Editar vehículo', values: v || {},
    fields: [
      {name:'type',label:'Tipo',type:'select',options:{carro:'🚗 Carro',moto:'🏍️ Moto'},required:true},
      {name:'name',label:'Nombre (ej. Mazda 3, Moto del trabajo)',required:true},
      {name:'plate',label:'Placa',required:true},
      {name:'brand',label:'Marca'},{name:'model',label:'Modelo / línea'},
      {name:'year',label:'Año',type:'number'},
      ...(isNew ? [{name:'current_km',label:'Kilometraje actual',type:'number',required:true},
        {name:'last_oil_km',label:'Último cambio de aceite hecho a los (km) — opcional'},
        {name:'last_oil_date',label:'Fecha de ese cambio (aprox.) — opcional',type:'date'}] : []),
      {name:'oil_interval_km',label:'Cambio de aceite cada (km)',type:'number',required:true,value:5000},
      {name:'alert_km_before',label:'Avisar cuando falten (km)',type:'number',required:true,value:500},
      {name:'notes',label:'Notas',type:'textarea'},
    ],
    onSubmit: async d => {
      d.plate = d.plate.toUpperCase();
      if(isNew){
        const oilKm = d.last_oil_km ? Number(String(d.last_oil_km).replace(/[.,\s]/g,'')) : null, oilDate = d.last_oil_date;
        delete d.last_oil_km; delete d.last_oil_date;
        const row = await add('mt_vehicles', d);
        if(oilKm) await add('mt_maintenance', {vehicle_id:row.id, kind:'aceite', done_at:oilDate||todayStr(), km:oilKm, next_km:oilKm+d.oil_interval_km});
        await add('mt_kmlog', {vehicle_id:row.id, km:d.current_km, logged_at:todayStr()});
      } else await upd('mt_vehicles', v.id, d);
      await loadAll(); render(); toast('Vehículo guardado');
    },
  });
}
function kmForm(v){
  openForm({
    title:`Actualizar kilometraje · ${v.name}`, submit:'Actualizar',
    fields:[{name:'km',label:`Kilometraje actual (último: ${fmtKm(v.current_km)})`,type:'number',required:true,value:v.current_km},
            {name:'logged_at',label:'Fecha',type:'date',required:true,value:todayStr()}],
    onSubmit: async d => { await setKm(v.id, d.km, d.logged_at); await loadAll(); render(); toast('Kilometraje actualizado'); },
  });
}
async function setKm(vehicleId, km, date){
  await add('mt_kmlog', {vehicle_id:vehicleId, km, logged_at:date || todayStr()});
  const v = state.vehicles.find(x=>x.id===vehicleId);
  if(!v || km >= v.current_km) await upd('mt_vehicles', vehicleId, {current_km:km});
}
function docForm(v, kind){
  openForm({
    title:`Registrar ${DOC_KINDS[kind||'soat']} · ${v.name}`, values:{kind:kind||'soat'},
    fields:[
      {name:'kind',label:'Documento',type:'select',options:DOC_KINDS,required:true},
      {name:'issue_date',label:'Fecha de expedición / pago',type:'date'},
      {name:'expiry_date',label:'Fecha de vencimiento',type:'date',required:true},
      {name:'cost',label:'Valor pagado (COP)',type:'number'},
      {name:'reference',label:'Nº póliza / certificado / referencia'},
      {name:'notes',label:'Notas',type:'textarea'},
    ],
    setup: f => autofill(f,'issue_date','expiry_date',addYear),
    onSubmit: async d => { await add('mt_documents', {...d, vehicle_id:v.id}); await loadAll(); render(); toast('Documento registrado'); },
  });
}
function maintForm(v, kind='aceite'){
  openForm({
    title:`Registrar mantenimiento · ${v.name}`, values:{kind, done_at:todayStr(), km:v.current_km},
    fields:[
      {name:'kind',label:'Tipo',type:'select',options:MAINT_KINDS,required:true},
      {name:'done_at',label:'Fecha',type:'date',required:true},
      {name:'km',label:'Kilometraje al hacerlo',type:'number',required:true},
      {name:'next_km',label:'Próximo cambio a los (km)',type:'number',placeholder:'Se calcula para el aceite'},
      {name:'next_date',label:'Próxima fecha (opcional)',type:'date'},
      {name:'cost',label:'Costo (COP)',type:'number'},
      {name:'shop',label:'Taller / lugar'},
      {name:'notes',label:'Notas (marca de aceite, filtro, etc.)',type:'textarea'},
    ],
    setup: f => autofill(f,'km','next_km', x => f.elements.kind.value==='aceite' && x ? Number(x)+v.oil_interval_km : null),
    onSubmit: async d => {
      await add('mt_maintenance', {...d, vehicle_id:v.id});
      if(d.km > v.current_km) await setKm(v.id, d.km, d.done_at);
      await loadAll(); render(); toast('Mantenimiento registrado');
    },
  });
}
function settingsForm(){
  const p = state.profile;
  openForm({
    title:'Notificaciones', values:p,
    fields:[
      {name:'notify_email',label:`Recibir avisos por correo (${p.email})`,type:'checkbox'},
      {name:'telegram_chat_id',label:'Telegram chat ID (opcional, gratis)',placeholder:'Ej. 123456789'},
    ],
    onSubmit: async d => { await upd('mt_users', p.id, d); Object.assign(p,d); toast('Preferencias guardadas'); },
  });
}

async function removeRow(table, id, msg){
  if(!confirm(msg)) return;
  try{ await del(table, id); await loadAll(); render(); }catch(e){ toast(e.message); }
}

/* ---------- vistas ---------- */
const route = () => location.hash.replace(/^#\/?/,'').split('/');

function header(){
  const p = state.profile;
  return `<header class="top"><div class="in">
    <h1 data-go="#/"><img src="logo.jpg" alt="Iskonex MotorTrack"></h1>
    ${p?.is_admin ? `<button class="btn sm" data-go="#/admin">Usuarios${state.users.filter(u=>!u.approved).length?`<span class="badge">${state.users.filter(u=>!u.approved).length}</span>`:''}</button>`:''}
    ${p?.approved ? `<button class="btn sm" data-act="settings">🔔 Avisos</button>`:''}
    <span class="muted hide-sm">${esc(p?.email||'')}</span>
    <button class="btn sm ghost" data-act="logout">Salir</button>
  </div></header>`;
}

function viewLogin(){
  if(!configured) return `<div class="center"><div class="card"><h2>Falta configurar</h2><p class="muted">Edita <code>config.js</code> con los datos de tu app web de Firebase (ver README).</p></div></div>`;
  return `<div class="hero"><img src="logo.jpg" alt="Iskonex MotorTrack — Tu vehículo, siempre bajo control">
    <p class="muted">SOAT, impuestos, técnico-mecánica, aceite y más, con avisos antes de que se venzan.</p>
    <button class="btn primary" style="font-size:1.1rem;padding:12px 28px" data-act="login">Entrar con Google</button></div>`;
}
function viewPending(){
  return header()+`<div class="center"><div class="card"><div style="font-size:3rem">⏳</div><h2>Cuenta pendiente</h2>
    <p class="muted">Tu cuenta (${esc(state.profile.email)}) fue registrada. El administrador debe autorizar tu acceso.</p>
    <button class="btn" data-act="reload">Revisar de nuevo</button></div></div>`;
}
function chips(items){ return `<ul class="chips">${items.map(i=>`<li class="chip ${i.level}">${esc(i.label)}: ${esc(i.text)}</li>`).join('')}</ul>`; }

function viewDashboard(){
  const all = state.vehicles.map(v => ({v, items:vehicleItems(v)}));
  const urgent = all.reduce((n,x)=>n+x.items.filter(i=>i.level==='bad').length,0);
  return header()+`<main>
    <div class="row between"><h2>Mis vehículos</h2><button class="btn primary" data-act="new-vehicle">+ Agregar vehículo</button></div>
    ${state.vehicles.length ? `<div class="banner ${urgent?'bad':'ok'}">${urgent?`⚠️ ${urgent} ${urgent===1?'asunto requiere':'asuntos requieren'} atención`:'✅ Todo al día'}</div>` : ''}
    <div class="grid">${all.map(({v,items})=>`<article class="card veh" data-go="#/v/${v.id}">
      <div class="vh"><span class="ico">${v.type==='moto'?'🏍️':'🚗'}</span><div><h3>${esc(v.name)}</h3><div class="muted">${esc(v.plate)}${v.brand?` · ${esc(v.brand)}`:''}${v.year?` ${v.year}`:''}</div></div></div>
      <div class="km">${fmtKm(v.current_km)}</div>${chips(items)}</article>`).join('')}</div>
    ${state.vehicles.length?'':'<div class="card muted">Aún no tienes vehículos. Agrega el primero para empezar.</div>'}
  </main>`;
}

function viewVehicle(id){
  const v = state.vehicles.find(x=>x.id===id);
  if(!v) return header()+`<main><p>Vehículo no encontrado. <a href="#/">Volver</a></p></main>`;
  const items = vehicleItems(v);
  const docs = state.docs.filter(d=>d.vehicle_id===id), maint = state.maint.filter(m=>m.vehicle_id===id), kms = state.kmlog.filter(k=>k.vehicle_id===id);
  const del = (t,i,m) => `<button class="btn sm danger" data-del="${t}:${i}" data-msg="${m}">Borrar</button>`;
  const tabs = {
    docs: `<div class="tablewrap"><table><tr><th>Documento</th><th>Expedición</th><th>Vence</th><th>Valor</th><th>Referencia</th><th></th></tr>
      ${docs.map(d=>`<tr><td>${DOC_KINDS[d.kind]}</td><td>${fmtDate(d.issue_date)}</td><td>${fmtDate(d.expiry_date)}</td><td>${fmtMoney(d.cost)}</td><td class="wrap">${esc(d.reference||'')}</td><td>${del('mt_documents',d.id,'¿Borrar este registro?')}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Sin registros</td></tr>'}</table></div>`,
    maint: `<div class="tablewrap"><table><tr><th>Tipo</th><th>Fecha</th><th>Km</th><th>Próximo</th><th>Costo</th><th>Taller / notas</th><th></th></tr>
      ${maint.map(m=>`<tr><td>${MAINT_KINDS[m.kind]}</td><td>${fmtDate(m.done_at)}</td><td>${fmtKm(m.km)}</td><td>${m.next_km!=null?fmtKm(m.next_km):''} ${m.next_date?fmtDate(m.next_date):''}</td><td>${fmtMoney(m.cost)}</td><td class="wrap">${esc([m.shop,m.notes].filter(Boolean).join(' · '))}</td><td>${del('mt_maintenance',m.id,'¿Borrar este registro?')}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Sin registros</td></tr>'}</table></div>`,
    km: `<div class="tablewrap"><table><tr><th>Fecha</th><th>Kilometraje</th><th></th></tr>
      ${kms.map(k=>`<tr><td>${fmtDate(k.logged_at)}</td><td>${fmtKm(k.km)}</td><td>${del('mt_kmlog',k.id,'¿Borrar esta lectura?')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Sin registros</td></tr>'}</table></div>`,
  };
  return header()+`<main>
    <p><a href="#/">← Mis vehículos</a></p>
    <div class="row between"><div class="vh"><span class="ico">${v.type==='moto'?'🏍️':'🚗'}</span><div><h2 style="margin:0">${esc(v.name)}</h2>
      <div class="muted">${esc(v.plate)}${v.brand?` · ${esc(v.brand)}`:''}${v.model?` ${esc(v.model)}`:''}${v.year?` ${v.year}`:''}</div></div></div>
      <div class="row"><button class="btn sm" data-act="edit-vehicle">Editar</button><button class="btn sm danger" data-act="del-vehicle">Eliminar</button></div></div>
    <div class="card row between" style="margin-top:14px"><div><div class="muted">Kilometraje actual</div><div class="km" style="margin:0">${fmtKm(v.current_km)}</div></div>
      <button class="btn primary" data-act="km">Actualizar km</button></div>
    <div class="items">${items.map(i=>`<div class="card item"><div class="lbl">${esc(i.label)}</div>
      <div class="big"><span class="chip ${i.level}">${esc(i.text)}</span></div>
      <div class="muted" style="margin-bottom:10px">${esc(i.detail||'')}</div>
      <button class="btn sm" data-act="${i.type==='oil'?'oil':'doc'}" data-kind="${i.kind||''}">${i.type==='oil'?'Registrar cambio':i.last?'Renovar':'Registrar'}</button></div>`).join('')}</div>
    <div class="row between"><h2 style="margin:0">Histórico</h2>
      <div class="row"><button class="btn sm" data-act="doc" data-kind="">+ Documento</button><button class="btn sm" data-act="maint">+ Mantenimiento</button></div></div>
    <div class="tabs">${[['docs','Documentos'],['maint','Mantenimiento'],['km','Kilometraje']].map(([k,t])=>`<button class="tab ${state.tab===k?'on':''}" data-tab="${k}">${t}</button>`).join('')}</div>
    <div class="card" style="padding:6px">${tabs[state.tab]}</div>
    ${v.notes?`<p class="muted">📝 ${esc(v.notes)}</p>`:''}
  </main>`;
}

function viewAdmin(){
  return header()+`<main><h2>Usuarios</h2><div class="card" style="padding:6px"><div class="tablewrap"><table>
    <tr><th></th><th>Nombre</th><th>Correo</th><th>Registro</th><th>Acceso</th></tr>
    ${state.users.map(u=>`<tr><td>${u.avatar_url?`<img class="avatar" src="${esc(u.avatar_url)}" alt="">`:''}</td><td>${esc(u.full_name||'')}</td><td>${esc(u.email)}</td><td>${fmtDate(u.created_at.slice(0,10))}</td>
      <td>${u.is_admin?'<span class="chip ok">Administrador</span>': u.approved
        ? `<button class="btn sm danger" data-access="${u.id}:false">Revocar</button>`
        : `<button class="btn sm primary" data-access="${u.id}:true">Aprobar</button>`}</td></tr>`).join('')}
  </table></div></div></main>`;
}

async function render(){
  const app = $('#app'), r = route();
  if(!state.session || !state.profile){ app.innerHTML = viewLogin(); return; }
  if(!state.profile.approved){ app.innerHTML = viewPending(); return; }
  if(state.profile.is_admin && !state.users.length){
    try{ await loadUsers(); }catch(e){}
  }
  if(r[0]==='admin' && state.profile.is_admin) app.innerHTML = viewAdmin();
  else if(r[0]==='v') app.innerHTML = viewVehicle(r[1]);
  else app.innerHTML = viewDashboard();
}

/* ---------- eventos ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-go],[data-act],[data-tab],[data-del],[data-access]');
  if(!el) return;
  const vid = route()[0]==='v' ? route()[1] : null, v = state.vehicles.find(x=>x.id===vid);
  if(el.dataset.go){ location.hash = el.dataset.go; return; }
  if(el.dataset.tab){ state.tab = el.dataset.tab; render(); return; }
  if(el.dataset.del){ const [t,i] = el.dataset.del.split(':'); removeRow(t,i,el.dataset.msg); return; }
  if(el.dataset.access){
    const [id,ok] = el.dataset.access.split(':');
    try{ await upd('mt_users', id, {approved: ok==='true'}); await loadUsers(); render(); toast(ok==='true'?'Usuario aprobado':'Acceso revocado');
    }catch(err){ toast(err.message); }
    return;
  }
  switch(el.dataset.act){
    case 'login': try{ await signInWithPopup(auth, new GoogleAuthProvider()); }catch(err){ toast(err.message); } break;
    case 'logout': await signOut(auth); state.session = state.profile = null; state.users = []; location.hash=''; render(); break;
    case 'reload': load(); break;
    case 'settings': settingsForm(); break;
    case 'new-vehicle': vehicleForm(); break;
    case 'edit-vehicle': vehicleForm(v); break;
    case 'del-vehicle':
      if(confirm(`¿Eliminar ${v.name} y TODO su histórico? No se puede deshacer.`)){
        try{
          const batch = writeBatch(db);
          for(const [col,rows] of [['mt_documents',state.docs],['mt_maintenance',state.maint],['mt_kmlog',state.kmlog]])
            rows.filter(r=>r.vehicle_id===v.id).forEach(r=>batch.delete(doc(db,col,r.id)));
          batch.delete(doc(db,'mt_vehicles',v.id)); await batch.commit(); await loadAll(); location.hash='#/'; render(); }catch(err){ toast(err.message); }
      } break;
    case 'km': kmForm(v); break;
    case 'doc': docForm(v, el.dataset.kind || null); break;
    case 'oil': maintForm(v,'aceite'); break;
    case 'maint': maintForm(v); break;
  }
});
window.addEventListener('hashchange', render);

if(configured){
  onAuthStateChanged(auth, () => { state.users = []; load(); });
} else load();
</script>
</body>
</html>
